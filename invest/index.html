<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>投资账本</title>
<meta name="description" content="按跌多投的规则算出今天每只基金投多少，一键记下；看总资产、财务自由度、定投进度和收益。">
<meta name="theme-color" content="#F0F1F6" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="投资账本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* Four pages, like a phone ledger: 账本 (what I own), 定投 (what I've put in), 计算器 (what to put in today, dark like a
   trading tool), 设置. Chinese market colours: gains red, losses green, always with a sign.
   Numbers use the rounded system face on Apple devices. */
:root{
  color-scheme:light;
  --bg:#F0F1F6; --card:#FFFFFF; --tile:#F5F6FA; --ink:#171A23; --ink-2:#696E7E; --muted:#9A9FAD; --line:#E6E8EF;
  --blue:#3366F0; --blue-soft:#E7EEFF; --violet:#7B61FF; --green:#16A35A; --green-soft:#E3F6EA; --orange:#FF9500; --purple:#8C5CF6;
  --up:#E5383B; --down:#0E9F55; --on-accent:#FFFFFF;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --heat1:#D6E2FF; --heat2:#9DB8FA; --heat3:#5E86F2; --heat4:#2D57D8;
  --h-sky1:#E8EFE9; --h-sky2:#F8EFE1; --h-sun:#F7D7A2; --h-glow:#FBE6C3; --h-m1:#C9D6CF; --h-m2:#AFC3B8; --h-near:#F6F7F3; --h-edge:#DFE5DD;
  --h-tree:#6D8A7C; --h-step:#93A89D; --h-ink:#1C3A2D; --h-ink-2:#3E6955; --h-pill:rgba(255,255,255,.62);
  --shadow:0 1px 2px rgba(23,26,35,.04),0 10px 28px -16px rgba(23,26,35,.18);
  --tabbar:rgba(255,255,255,.86);
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121215; --card:#1D1D21; --tile:#27272C; --ink:#F1F2F5; --ink-2:#A6A9B4; --muted:#7E828E; --line:#303036;
    --blue:#6B93FF; --blue-soft:#24304D; --violet:#9C88FF; --green:#38C77A; --green-soft:#1D3527; --orange:#FF9F0A; --purple:#A887FF;
    --up:#FF6467; --down:#3DD68C;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --heat1:#22304F; --heat2:#2E4C93; --heat3:#4570DA; --heat4:#7EA0FF;
    --h-sky1:#16222A; --h-sky2:#22303A; --h-sun:#ECE6CF; --h-glow:rgba(236,230,207,.22); --h-m1:#2B3B44; --h-m2:#22313A; --h-near:#2F3F48; --h-edge:#3A4C55;
    --h-tree:#16232A; --h-step:#647B86; --h-ink:#EAF2EC; --h-ink-2:#B5CABE; --h-pill:rgba(20,30,36,.55);
    --shadow:none; --tabbar:rgba(29,29,33,.88);
  }
}
:root[data-theme="dark"],:root[data-page="calc"]{
  color-scheme:dark;
  --bg:#121215; --card:#1D1D21; --tile:#27272C; --ink:#F1F2F5; --ink-2:#A6A9B4; --muted:#7E828E; --line:#303036;
  --blue:#6B93FF; --blue-soft:#24304D; --violet:#9C88FF; --green:#38C77A; --green-soft:#1D3527; --orange:#FF9F0A; --purple:#A887FF;
  --up:#FF6467; --down:#3DD68C;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --heat1:#22304F; --heat2:#2E4C93; --heat3:#4570DA; --heat4:#7EA0FF;
  --h-sky1:#16222A; --h-sky2:#22303A; --h-sun:#ECE6CF; --h-glow:rgba(236,230,207,.22); --h-m1:#2B3B44; --h-m2:#22313A; --h-near:#2F3F48; --h-edge:#3A4C55;
  --h-tree:#16232A; --h-step:#647B86; --h-ink:#EAF2EC; --h-ink-2:#B5CABE; --h-pill:rgba(20,30,36,.55);
  --shadow:none; --tabbar:rgba(29,29,33,.88);
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background-color .25s}
h1,h2,h3,p,ol,ul,dl,dd{margin:0}
ol,ul{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:560px;margin-inline:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
#view{display:grid;gap:14px;min-width:0}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:4px}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--tabbar);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:4px 0;font-size:11px;color:var(--muted)}
.tabbar button svg.i{width:24px;height:24px}
.tabbar button[aria-selected="true"]{color:var(--blue);font-weight:600}
:root[data-page="calc"] .tabbar button[aria-selected="true"]{color:var(--orange)}

/* cards */
.card{background:var(--card);border-radius:22px;padding:18px;display:grid;gap:14px;min-width:0;box-shadow:var(--shadow)}
.sh{display:flex;align-items:center;gap:10px;min-width:0}
.sh h2{font-size:18px;font-weight:700;letter-spacing:.01em;flex:1;min-width:0}
.badge{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.badge svg.i{width:16px;height:16px;stroke-width:2.4}
.pill{border:0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;background:var(--blue-soft);color:var(--blue);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.plain{background:none;color:var(--ink-2);font-weight:400;padding-inline:4px}
.pill svg.i{width:15px;height:15px}
.hint{font-size:12.5px;color:var(--ink-2)}
.hint:empty{display:none}
.msg{font-size:13px;color:var(--up)}
.msg:empty{display:none}
.empty{font-size:14px;color:var(--ink-2)}

/* hero (账本) */
.hero{position:relative;overflow:hidden;border-radius:26px;min-height:214px;padding:22px 20px 20px;color:var(--h-ink);box-shadow:var(--shadow);isolation:isolate}
.hero .scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero h1{font-size:27px;font-weight:800;letter-spacing:.04em;line-height:1.2}
.hero .slogan{font-size:13.5px;color:var(--h-ink-2);margin-top:4px;letter-spacing:.04em}
.hero .datepill{position:absolute;top:20px;right:16px;display:flex;align-items:center;gap:6px;background:var(--h-pill);border-radius:999px;padding:5px 12px 5px 9px;font:600 13.5px var(--font-num);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero .datepill svg.i{width:18px;height:18px}
.hero .lab{font-size:13px;color:var(--h-ink-2);margin-top:26px}
.hero .total{font:800 44px/1.05 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px;overflow-wrap:anywhere}
.hero .sub{font-size:12.5px;color:var(--h-ink-2);margin-top:4px}

.strip{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.strip .badge{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#FF9500,#FFC20E)}
.strip .badge svg.i{width:19px;height:19px}
.strip .t{flex:1;min-width:0;display:grid}
.strip .t b{font-size:15px}
.strip .t span{font-size:12.5px;color:var(--ink-2)}
.strip > svg.i{color:var(--muted)}

/* ring + key/values */
.ringrow{display:grid;grid-template-columns:118px minmax(0,1fr);gap:18px;align-items:center}
.ring{width:118px;height:118px;position:relative}
.ring svg{display:block;width:100%;height:100%}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .t b{font:800 25px/1.1 var(--font-num);color:var(--blue)}
.ring .t small{font-size:12px;color:var(--ink-2)}
.ring.sm{width:100px;height:100px}
.ring.sm .t b{font-size:20px;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 10px;font-size:14px;align-items:baseline}
.kv dt{color:var(--ink-2)}
.kv dd{text-align:right;font:700 16px var(--font-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv dd.hl{color:var(--blue)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--tile);border-radius:16px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0;border:0;text-align:left}
button.tile{cursor:pointer}
.tile .k{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink-2)}
.tile .k svg.i{width:22px;height:22px}
.tile .v{font:800 23px/1.15 var(--font-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{font-size:11.5px;color:var(--muted);line-height:1.4}
.tiles.solo .tile{background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:16px}
.tiles.solo .tile .v{font-size:25px}

/* goal progress */
.prog{display:grid;grid-template-columns:100px minmax(0,1fr);gap:18px;align-items:center}
.prog .done-k{font-size:13px;color:var(--ink-2)}
.prog .done-v{font:800 30px/1.15 var(--font-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.prog .goal{font-size:13.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
.prog .goal b{color:var(--green)}

/* holdings */
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum3 div{display:grid;gap:2px;min-width:0}
.sum3 span{font-size:12px;color:var(--ink-2)}
.sum3 b{font:800 18px var(--font-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.alloc{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;background:var(--tile)}
.alloc i{display:block;height:100%;min-width:3px}
.funds{display:grid}
.funds > li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.funds > li:first-child{border-top:0;padding-top:4px}
.funds .dot{width:10px;height:10px;border-radius:50%}
.funds .nm{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.funds .nm small{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
.funds .val{text-align:right;display:grid;justify-items:end}
.funds .val b{font:700 16px var(--font-num);font-variant-numeric:tabular-nums}
.funds .val span{font:600 12.5px var(--font-num);font-variant-numeric:tabular-nums}
.funds .edit{grid-column:1 / -1}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--blue);font-size:13px;font-weight:600}
.link{background:none;border:0;padding:4px 0;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--up)}

/* charts */
.viz{position:relative;min-width:0}
.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz .grid{stroke:var(--line);stroke-width:1}
.viz .ax{fill:var(--muted);font:500 10.5px var(--font-num)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend i.dash{border-top-style:dashed}
.tip{position:absolute;z-index:2;pointer-events:none;background:var(--ink);color:var(--card);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.5;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 6px 20px rgba(0,0,0,.18)}
.tip b{font:700 12.5px var(--font-num)}
[data-tip]{cursor:pointer}
.hit{fill:transparent}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal span{font-size:11px;color:var(--muted);text-align:center}
.cal i{aspect-ratio:1;border-radius:8px;background:var(--tile);display:grid;place-items:center;font:600 11.5px var(--font-num);font-style:normal;color:var(--ink-2)}
.cal i.h1{background:var(--heat1)} .cal i.h2{background:var(--heat2)} .cal i.h3{background:var(--heat3);color:#fff} .cal i.h4{background:var(--heat4);color:#fff}
.cal i.today{box-shadow:inset 0 0 0 2px var(--blue)}
.cal i.blank{background:none}
.cal i.we{opacity:.45}
.heatkey{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);justify-content:flex-end}
.heatkey i{width:12px;height:12px;border-radius:3px;background:var(--tile)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button{border:0;background:var(--tile);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.monthnav button svg.i{width:16px;height:16px}
.monthnav b{font:700 14px var(--font-num);min-width:72px;text-align:center}

/* 定投 hero */
.dhero{position:relative;overflow:hidden;background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px;isolation:isolate}
.dhero .deco{position:absolute;right:-10px;bottom:-6px;width:62%;height:100%;z-index:-1;opacity:.9}
.dhero .flag{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--green);font-size:15px}
.dhero .flag svg.i{width:22px;height:22px;fill:var(--green)}
.dhero .k{font-size:14px;color:var(--ink-2);margin-top:12px}
.dhero .days{font:800 64px/1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dhero .days small{font:500 20px var(--font-body);color:var(--ink-2);margin-left:6px;letter-spacing:0}
.dhero .from{font-size:13px;color:var(--ink-2);margin-top:10px}
.rules{align-self:center;display:grid;gap:8px;font-size:13.5px;justify-items:start;padding-left:6px}
.rules h3{font-size:13px;font-weight:700;color:var(--green);letter-spacing:.02em}
.rules p{display:flex;gap:7px;align-items:baseline}
.rules p b{font:800 14px var(--font-num);color:var(--green);min-width:2.2em}
.rules p span{color:var(--ink)}

/* forms */
.inp{width:100%;min-width:0;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--tile);font:600 17px var(--font-num);font-variant-numeric:tabular-nums}
.inp.text{font:400 16px var(--font-body)}
.inp::placeholder{color:var(--muted);font-weight:400}
textarea.inp{height:auto;padding:10px 12px;font:400 15px var(--font-body)}
select.inp{font:400 16px var(--font-body);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.field{display:grid;gap:6px;min-width:0}
.field > label,.field > .lab{font-size:13px;color:var(--ink-2)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.unit{display:flex;align-items:center;gap:8px;min-width:0}
.unit span{flex:none;font-size:14px;color:var(--ink-2)}
.check{display:flex;align-items:flex-start;gap:9px;font-size:14px;line-height:1.5}
.check input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--blue)}
.btn{height:48px;border-radius:14px;border:0;background:var(--blue);color:var(--on-accent);font-weight:700;font-size:15.5px;padding-inline:18px}
.btn.ghost{background:var(--tile);color:var(--ink);font-weight:500}
.btn.small{height:42px;font-size:14.5px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{flex:1 1 130px}
.actions .btn.full{flex-basis:100%}
.inline{display:grid;gap:12px;padding:14px;border-radius:16px;background:var(--tile)}
.inline .inp{background:var(--card)}
.inline .btn.ghost{background:var(--card)}

/* records */
.recs{display:grid}
.recs li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.recs li:first-child{border-top:0}
.recs .d{font-size:14px;font-weight:600}
.recs .d small{font-weight:400;color:var(--ink-2);margin-left:6px;font-size:12.5px}
.recs .a{font:700 16px var(--font-num);font-variant-numeric:tabular-nums;text-align:right}
.recs .x{grid-column:1 / -1;display:flex;gap:12px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.recs .x .link{padding:0;font-size:12.5px}
.recs .x .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* 计算器 (dark) */
.calc-title{display:grid;justify-items:center;gap:2px;text-align:center;padding-top:6px}
.calc-title h1{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:700;letter-spacing:.04em}
.calc-title h1 svg.i{width:28px;height:28px;color:var(--orange)}
.calc-title p{font:500 14px var(--font-num);color:var(--ink-2)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seg button{border:0;height:46px;border-radius:13px;background:none;color:var(--ink-2);font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-selected="true"]{background:var(--tile);color:var(--ink)}
.seg button svg.i{width:19px;height:19px}
.seg .cnt{min-width:24px;height:24px;border-radius:12px;background:var(--orange);color:#1A1205;font:700 12.5px/24px var(--font-num);padding:0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink-2)}
.chips button[aria-pressed="true"]{border-color:var(--orange);color:var(--orange);font-weight:600}
.cfield{display:grid;gap:8px;min-width:0}
.cfield .lab{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--ink-2)}
.cfield .lab svg.i{width:18px;height:18px}
.cbox{position:relative}
.cbox .inp{height:56px;border-radius:14px;font-size:20px;padding:0 16px;background:var(--tile);border-color:var(--line);letter-spacing:.04em}
.cbox .suf{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}
.zone{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--tile);display:flex;align-items:center;padding:0 16px;font-size:17px;font-weight:700}
.zone.z0,.zone.z1{color:var(--green)} .zone.z2{color:var(--ink)} .zone.z3{color:var(--orange)} .zone.z4{color:var(--up)} .zone.none{color:var(--muted);font-weight:400;font-size:14px}
.go{height:58px;border:0;border-radius:16px;background:linear-gradient(90deg,#FF8A00,#FFC312);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 28px -10px rgba(255,149,0,.7);width:100%;letter-spacing:.06em}
.go svg.i{width:24px;height:24px}
.res{background:var(--tile);border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;gap:12px}
.res.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ .res.pop{animation:none} body{transition:none} }
.ctile{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;background:var(--card);min-width:0}
.ctile .k{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink-2)}
.ctile .k svg.i{width:18px;height:18px}
.ctile .v{font:600 26px/1.1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.ctile .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ctile .tier{color:var(--green);font-size:14px;font-weight:600}
.today-amt{border:1px solid rgba(255,149,0,.55);background:linear-gradient(180deg,rgba(255,149,0,.16),rgba(255,149,0,.06));border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.today-amt .k{display:flex;align-items:center;gap:8px;color:var(--orange);font-size:15px;font-weight:700}
.today-amt .k svg.i{width:24px;height:24px}
.today-amt .v{font:800 40px/1 var(--font-num);margin-left:auto;font-variant-numeric:tabular-nums;color:var(--orange);letter-spacing:.02em}
.brk{display:grid}
.brk li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.brk li:first-child{border-top:0}
.brk .nm{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.brk .amt{font:700 17px var(--font-num);font-variant-numeric:tabular-nums}
.brk .why{grid-column:1 / -1;font-size:12.5px;color:var(--ink-2)}
.brk .off{color:var(--muted)}
.btn.light{background:#F4F4F6;color:#141416}
.btn.dim{background:var(--tile);color:var(--ink);font-weight:500}
.donebox{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;background:rgba(56,199,122,.12);color:var(--green);font-size:14px;font-weight:600}
.donebox svg.i{width:20px;height:20px}
.pyr{display:grid;gap:10px}
.pyr svg{display:block;width:100%;height:auto}
.pyr .lvl{fill:var(--tile);stroke:var(--line)}
.pyr .lvl.on{fill:url(#pyrOn);stroke:none}
.pyr text{font:600 12.5px var(--font-num);fill:var(--ink-2)}
.pyr text.on{fill:#2A1700;font-weight:800}

details.card > summary{cursor:pointer;font-size:16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::after{content:"展开";font-weight:400;font-size:13px;color:var(--ink-2)}
details.card[open] > summary::after{content:"收起"}
.setlist{display:grid}
.setlist > li{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.setlist > li:first-child{border-top:0;padding-top:0}
.li-top{display:flex;align-items:baseline;gap:10px}
.li-top b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.li-top .link{margin-left:auto}
.li-sub{font-size:12.5px;color:var(--ink-2)}
.tiers{display:grid;gap:8px}
.tier-row{display:grid;grid-template-columns:auto 76px auto 76px auto;gap:6px;align-items:center;font-size:14px}
.tier-row .inp{height:42px;font-size:16px;padding:0 8px}
.cuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cuts .inp{height:42px;font-size:16px;padding:0 8px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;max-width:calc(100% - 32px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px}
@media (max-width:370px){ .sh h2{font-size:16px} .dhero{grid-template-columns:minmax(0,1fr)} .rules{grid-template-columns:repeat(3,auto);justify-content:start;gap:4px 14px;padding-left:0} .rules h3{grid-column:1 / -1} .hero .total{font-size:38px} .dhero .days{font-size:52px} .ringrow{grid-template-columns:100px minmax(0,1fr)} .ring{width:100px;height:100px} .today-amt .v{font-size:38px} .tier-row{grid-template-columns:auto 64px auto 64px auto} }

<script>

/* ---------- icons (24px grid, stroked) ---------- */
var P = {
  book: '<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7.5h6"/>',

  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  calDots: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/>',

  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5.5a3 3 0 0 0 3 4M16 6h2.5a3 3 0 0 1-3 4M12 13v4M8.5 20.5h7M10 17h4v3.5h-4z"/>',

  up: '<path d="M3 16.5 9 10.5l3.5 3.5L21 6"/>',
  times: '<path d="M7 7l10 10M17 7 7 17"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  money: '<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',
  target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".6"/>'
};
function ic(n, style){ return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"' + (style ? ' style="' + style + '"' : '') + '>' + P[n] + '</svg>'; }
function badge(n, color){ return '<span class="badge" style="background:' + color + '">' + ic(n) + '</span>'; }

/* ---------- state ---------- */
var APP_VERSION = '2.0.0';
var LS_KEY = 'invest-book.v1', BK_KEY = 'invest-book.backupAt';
var INDEX = { ndx: '纳斯达克100', spx: '标普500' };
var SHORT = { ndx: '纳指', spx: '标普' };
/* examples only: the owner sets their own rule and valuation bands in 设置 */
var DEFAULT_TIERS = [[0, 1], [5, 1.5], [8, 2], [12, 2.5], [20, 3]];
var DEFAULT_CUTS = { ndx: [24, 31, 37, 43], spx: [18, 22, 26, 30] };
var ZONES = ['低估区', '偏低估值区', '合理估值区', '偏高估值区', '高估区'];
var DEFAULT_SLOGAN = '一步一步，走到目标';

function blank(){
  return {
    indices: { ndx: { high: null, level: null, levelDate: null }, spx: { high: null, level: null, levelDate: null } },
    tiers: DEFAULT_TIERS.map(function(t){ return t.slice(); }),
    funds: [], entries: [], skipped: [],
    cash: null, goal: null,
    slogan: '', startDate: null, goalMonth: null, goalYear: null, yearStart: null,
    pe: { ndx: null, spx: null }, peCuts: { ndx: DEFAULT_CUTS.ndx.slice(), spx: DEFAULT_CUTS.spx.slice() },
    history: [], days: {}
  };
}
var state = blank();
var ui = { tab: 'book', calcTab: 'calc', calcIdx: null, pop: false, snapOpen: false, snap: null, pasteBox: false, howto: false,
  editFund: null, addFund: false, editValue: null, confirmDel: null, showAll: false, manual: false, confirmUndo: false, confirmDelFund: false,
  editGoal: null, detail: null, calMonth: null, showAllDays: false, openDay: null };
var pending = null;

function cleanIndex(x){
  x = x || {};
  var h = toLevel(x.high), l = toLevel(x.level);
  return { high: h, level: l, levelDate: l != null && validDate(x.levelDate) ? x.levelDate : null };
}
function cleanTiers(t){
  if (!Array.isArray(t)) return null;
  var out = t.filter(function(r){ return Array.isArray(r) && isFinite(r[0]) && isFinite(r[1]) && r[0] >= 0 && r[0] < 100 && r[1] >= 0 && r[1] <= 20; })
    .map(function(r){ return [Math.round(r[0] * 100) / 100, Math.round(r[1] * 100) / 100]; })
    .sort(function(a, b){ return a[0] - b[0]; });
  if (!out.length || out[0][0] !== 0) return null;
  for (var i = 1; i < out.length; i++) if (out[i][0] === out[i - 1][0]) return null;
  return out.slice(0, 8);
}
function cleanCuts(c){
  if (!Array.isArray(c) || c.length !== 4) return null;
  for (var i = 0; i < 4; i++){ if (!isFinite(c[i]) || c[i] <= 0 || c[i] >= 1000 || (i && c[i] <= c[i - 1])) return null; }
  return c.map(Number);
}
var cents = function(v){ return Number.isInteger(v) && v >= 0 && v <= MAX ? v : null; };
function cleanFund(f){
  if (!f || !S(f.name, 30)) return null;
  var n = cents;
  return {
    id: S(f.id, 40) || uid(), name: S(f.name, 30),
    index: INDEX[f.index] ? f.index : 'none',
    scale: !!f.scale && !!INDEX[f.index],
    base: n(f.base), limit: n(f.limit), prior: n(f.prior) || 0,
    value: n(f.value), valueDate: n(f.value) != null && validDate(f.valueDate) ? f.valueDate : null,
    /* cost as the fund platform reports it (资产 − 持仓收益), taken from a screenshot at snapTs */
    cost: n(f.value) != null ? n(f.cost) : null, snapTs: Number.isFinite(f.snapTs) ? f.snapTs : 0
  };
}
function cleanEntry(e){
  if (!e || !validDate(e.date) || !S(e.fund, 40)) return null;
  var a = e.amt;
  if (!Number.isInteger(a) || a <= 0 || a > MAX) return null;
  return { id: S(e.id, 40) || uid(), date: e.date, fund: S(e.fund, 40), amt: a, ts: Number.isFinite(e.ts) ? e.ts : 0, plan: !!e.plan };
}
function cleanDay(d){
  if (!d || typeof d !== 'object') return null;
  var out = {}, any = false;
  Object.keys(INDEX).forEach(function(k){
    var x = d[k]; if (!x) return;
    var l = toLevel(x.l), h = toLevel(x.h), m = isFinite(x.m) && x.m >= 0 && x.m <= 20 ? Number(x.m) : null;

function cleanState(o){
  o = o || {};
  var s = blank();
  s.indices.ndx = cleanIndex(o.indices && o.indices.ndx);
  s.indices.spx = cleanIndex(o.indices && o.indices.spx);
  s.tiers = cleanTiers(o.tiers) || s.tiers;
  s.funds = Array.isArray(o.funds) ? o.funds.map(cleanFund).filter(Boolean).slice(0, 20) : [];
  s.entries = Array.isArray(o.entries) ? o.entries.map(cleanEntry).filter(Boolean) : [];
  s.skipped = Array.isArray(o.skipped) ? o.skipped.filter(validDate).slice(-60) : [];
  if (o.cash && Number.isInteger(o.cash.balance) && o.cash.balance >= 0 && Number.isFinite(o.cash.ts)) s.cash = { balance: o.cash.balance, ts: o.cash.ts };
  s.goal = Number.isInteger(o.goal) && o.goal > 0 ? o.goal : null;
  s.slogan = S(o.slogan, 24);
  s.startDate = validDate(o.startDate) ? o.startDate : null;
  s.goalMonth = Number.isInteger(o.goalMonth) && o.goalMonth > 0 ? o.goalMonth : null;
  s.goalYear = Number.isInteger(o.goalYear) && o.goalYear > 0 ? o.goalYear : null;
  var y = o.yearStart;
  if (y && Number.isInteger(y.year) && cents(y.assets) != null && cents(y.cost) != null) s.yearStart = { year: y.year, assets: y.assets, cost: y.cost };
  Object.keys(INDEX).forEach(function(k){
    var p = o.pe && o.pe[k];
    s.pe[k] = p && toPe(p.v) != null && validDate(p.d) ? { v: toPe(p.v), d: p.d } : null;
    s.peCuts[k] = cleanCuts(o.peCuts && o.peCuts[k]) || s.peCuts[k];
  });
  var seen = {};
  s.history = (Array.isArray(o.history) ? o.history : []).filter(function(h){ return h && validDate(h.d) && cents(h.v) != null && cents(h.c) != null; })
    .map(function(h){ return { d: h.d, v: h.v, c: h.c }; }).sort(function(a, b){ return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; })
    .reverse().filter(function(h){ if (seen[h.d]) return false; seen[h.d] = true; return true; }).reverse().slice(-500);

}
var loadFailed = false;
function load(){
  try { var raw = window.localStorage.getItem(LS_KEY); if (raw) state = cleanState(JSON.parse(raw)); }
  catch (e) { loadFailed = true; }
}
function save(){
  if (loadFailed){ toast('读取已有内容时出错，为了不覆盖它，这次没有保存。'); return false; }
  try { window.localStorage.setItem(LS_KEY, JSON.stringify(state)); return true; }
  catch (e) { toast('这台设备的存储写不进去，可能是空间满了，或者浏览器开着无痕模式。'); return false; }
}

/* ---------- the rule: how much today ---------- */
function drawdown(k){
  var x = state.indices[k];

    if (used){ $('#f-msg').textContent = '这只基金有过记录，删掉后记录会显示成“已删除的基金”。不想留，就先在“定投”页的记录里删掉它的记录。'; if (!ui.confirmDelFund){ ui.confirmDelFund = true; b.textContent = '仍然删除这只基金'; return; } }
    else if (!ui.confirmDelFund){ ui.confirmDelFund = true; b.textContent = '再点一次确认删除这只基金'; return; }
    state.funds = state.funds.filter(function(f){ return f.id !== ui.editFund; }); ui.editFund = null; ui.confirmDelFund = false;
    if (save()) toast('已删除'); render();
  } else if (act === 'add-tier'){
    var rows = readTiers(); var last = rows[rows.length - 1] || [0, 1];
    rows.push([(isFinite(last[0]) ? last[0] : 0) + 5, isFinite(last[1]) ? last[1] : 1]);
    $('#tierRows').innerHTML = rows.map(function(r, i){ return tierRow([isFinite(r[0]) ? r[0] : '', isFinite(r[1]) ? r[1] : ''], i); }).join('');
  } else if (act === 'del-tier'){
    var rs = readTiers(); rs.splice(Number(b.dataset.i), 1);
    $('#tierRows').innerHTML = rs.map(function(r, i){ return tierRow([isFinite(r[0]) ? r[0] : '', isFinite(r[1]) ? r[1] : ''], i); }).join('');
  } else if (act === 'export') exportBackup();
  else if (act === 'import'){ var fi = $('#bk-file'); if (!fi){ ui.tab = 'set'; render(); fi = $('#bk-file'); } fi.click(); }
  else if (act === 'import-yes') applyImport();
  else if (act === 'import-no'){ pending = null; render(); }
});
document.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' && ev.target.closest && ev.target.closest('.cbox')){ ev.preventDefault(); saveCalc(); } if (ev.key === 'Escape') hideTip(); });
document.addEventListener('input', function(ev){
  if (ev.target.id === 'c-pe'){ var v = toPe(ev.target.value), z = $('.zone'); if (!z) return; var k = ui.calcIdx; z.className = 'zone ' + (v == null ? 'none' : 'z' + zoneOf(k, v)); z.textContent = v == null ? '填 PE 后显示' : ZONES[zoneOf(k, v)]; }
});
document.addEventListener('change', function(ev){
  var el = ev.target;
  if (el.id === 'bk-file'){ var f = el.files && el.files[0]; el.value = ''; if (f) readFile(f); }
});

document.addEventListener('submit', function(ev){
  ev.preventDefault();
  var form = ev.target, kind = form.dataset.form, t = today();
  var money = function(id){ var raw = $(id).value.trim(); return raw === '' ? { empty: true, v: null } : { empty: false, v: toCents(raw) }; };
  if (kind === 'snap'){ applySnap(); return; }
  if (kind === 'value'){
    var c = toCents($('#v-amt').value), f = fundById(form.dataset.id);
    if (c == null){ $('#v-msg').textContent = '填一个金额，最多两位小数。'; return; }
    if (f.cost != null){ f.cost = investedFor(f); f.snapTs = Date.now(); }
    f.value = c; f.valueDate = t; ui.editValue = null;
    recordHistory();
    if (save()) toast('市值已更新'); render();
  } else if (kind === 'manual'){
    var d = $('#m-date').value, a = toCents($('#m-amt').value), fid = $('#m-fund').value;
    if (!validDate(d) || d > t){ $('#m-msg').textContent = '日期选今天或以前。'; return; }
    if (!a){ $('#m-msg').textContent = '金额填一个大于 0 的数，最多两位小数。'; return; }
    state.entries.push({ id: uid(), date: d, fund: fid, amt: a, ts: Date.now(), plan: false });
    if (save()) toast('已记下'); render();
  } else if (kind === 'goal'){
    var gv = money('#goal-in'), gk = form.dataset.k;
    if (!gv.empty && !gv.v){ $('#goal-msg').textContent = '填一个大于 0 的金额，最多两位小数；留空表示不设。'; return; }
    if (gk === 'free') state.goal = gv.v; else if (gk === 'month') state.goalMonth = gv.v; else state.goalYear = gv.v;
    ui.editGoal = null; if (save()) toast('目标已保存'); render();
  } else if (kind === 'ystart'){
    var ya = money('#ys-a'), yc = money('#ys-c');
    if (ya.v == null || yc.v == null){ $('#ys-msg').textContent = '两个都填数字，今年才开始就填 0。'; return; }
    state.yearStart = { year: Number(t.slice(0, 4)), assets: ya.v, cost: yc.v };
    ui.editGoal = null; if (save()) toast('年初数据已保存'); render();
  } else if (kind === 'fund'){
    var msg = $('#f-msg'), name = S($('#f-name').value, 30);
    var base = $('#f-base').value.trim() === '' ? null : toCents($('#f-base').value);
    var limit = $('#f-limit').value.trim() === '' ? null : toCents($('#f-limit').value);
    var prior = $('#f-prior').value.trim() === '' ? 0 : toCents($('#f-prior').value);
    var idx = $('#f-index').value;
    if (!name){ msg.textContent = '填基金名称。'; return; }
    if ((base == null && $('#f-base').value.trim() !== '') || (limit == null && $('#f-limit').value.trim() !== '') || prior == null){ msg.textContent = '金额填数字，最多两位小数。'; return; }
    if (state.funds.some(function(x){ return x.name === name && x.id !== ui.editFund; })){ msg.textContent = '已经有一只叫这个名字的基金了。'; return; }
    var data = { name: name, index: idx, scale: $('#f-scale').checked && idx !== 'none', base: base, limit: limit, prior: prior };
    if (ui.editFund){ var cur = fundById(ui.editFund); Object.keys(data).forEach(function(k){ cur[k] = data[k]; }); }
    else state.funds.push(cleanFund(Object.assign({ id: uid() }, data)));
    ui.editFund = null; ui.addFund = false;
    if (save()) toast('已保存'); render();
  } else if (kind === 'highs'){
    var bad = false;
    Object.keys(INDEX).forEach(function(k){ var raw = $('#h-' + k).value.trim(), v = raw === '' ? null : toLevel(raw); if (raw !== '' && v == null) bad = true; else state.indices[k].high = v; });
    if (bad){ $('#h-msg').textContent = '高点填一个正数，比如 31361.37'; return; }
    if (save()) toast('高点已保存'); render();
  } else if (kind === 'tiers'){
    var tiers = cleanTiers(readTiers());
    if (!tiers || tiers.length !== readTiers().length){ $('#t-msg').textContent = '每一档都要填数字，回撤起点从 0 开始、从小到大不重复，倍数在 0 到 20 之间。'; return; }
    state.tiers = tiers;
    if (save()) toast('规则已保存'); render();
  } else if (kind === 'cuts'){
    var next = {}, okAll = true;
    Object.keys(INDEX).forEach(function(k){ var arr = $$('[data-cut="' + k + '"]').map(function(i){ var v = i.value.trim(); return v === '' ? NaN : Number(v); }); var c2 = cleanCuts(arr); if (!c2) okAll = false; else next[k] = c2; });
    if (!okAll){ $('#cut-msg').textContent = '每个指数填四个正数，从小到大，不能相等。'; return; }
    state.peCuts = next; if (save()) toast('估值区间已保存'); render();
  } else if (kind === 'money'){
    var cb = money('#c-bal'), g = money('#g-amt'), gm = money('#gm-amt'), gy = money('#gy-amt');
    if ([cb, g, gm, gy].some(function(x){ return !x.empty && x.v == null; })){ $('#c-msg').textContent = '金额填数字，最多两位小数。'; return; }
    if (cb.v != null) state.cash = { balance: cb.v, ts: Date.now() };
    state.goal = g.v || null; state.goalMonth = gm.v || null; state.goalYear = gy.v || null;
    if (save()) toast('已保存'); render();
  } else if (kind === 'info'){
    var sd = $('#i-start').value;
    if (sd && (!validDate(sd) || sd > t)){ $('#i-msg').textContent = '日期选今天或以前。'; return; }
    state.slogan = S($('#i-slogan').value, 24); state.startDate = sd || null;
    if (save()) toast('已保存'); render();
  }
});

var lastDay = today();
document.addEventListener('visibilitychange', function(){ if (!document.hidden && today() !== lastDay){ lastDay = today(); ui.confirmUndo = false; render(); } });
if (window.matchMedia){ var mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', render); }

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); } catch (e) {}

$('#ver').textContent = APP_VERSION;
load();
render();
})();
</script>
